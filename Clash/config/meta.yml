# meta general
unified-delay: true
tcp-concurrent: true

# Shared DNS for Stash and Mihomo.
dns:
  enable: true
  enhanced-mode: fake-ip
  respect-rules: true # Mihomo / OpenClash
  follow-rule: true # Stash
  ipv6: false
  # Bootstrap DNS.
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver: &dns-direct
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  proxy-server-nameserver: *dns-direct
  # Overseas domain policy.
  nameserver-policy:
    "rule-set:Overseas_domain":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
  fallback: []

# meta sniffer
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"