  - name: 💰 Banking@HK
    <<: *x-pp-select-region

  - name: 🈲 Restricted
    <<: *x-pp-select-all-custom

  ## region groups
  - name: 🇭🇰 香港优选
    <<: *x-pp-region
    filter: '(?i)^(?!.*(?:专用|noauto))(?=.*(?:🇭🇰|\bHK[G]?\b|Hong.*?Kong|\bHKT\b|\bHKBN\b|\bHGC\b|\bWTT\b|\bCMI\b|[^-]港)).*$'

  - name: 🇺🇸 美国优选
    <<: *x-pp-region
    filter: '(?i)^(?!.*(?:专用|noauto))(?=.*(?:🇺🇸|\bUS[A]?\b|America|United.*?States|美国|[^-]美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥)).*$'

  - name: 🇯🇵 日本优选
    <<: *x-pp-region
    filter: '(?i)^(?!.*(?:专用|noauto))(?=.*(?:🇯🇵|\bJP[N]?\b|Japan|Tokyo|Osaka|Saitama|日本|东京|大阪|埼玉|[^-尼]日)).*$'

  - name: 🇹🇼 台湾优选
    <<: *x-pp-region
    filter: '(?i)^(?!.*(?:专用|noauto))(?=.*(?:🇹🇼|\bTW[N]?\b|Taiwan|新北|彰化|\bCHT\b|台湾|[^-]台|\bHINET\b)).*$'

  - name: 🇸🇬 新加坡优选
    <<: *x-pp-region
    filter: '(?i)^(?!.*(?:专用|noauto))(?=.*(?:🇸🇬|\bSG[P]?\b|Singapore|新加坡|狮城)).*$'

  - name: 🇰🇷 韩国优选
    <<: *x-pp-region
    filter: '(?i)^(?!.*(?:专用|noauto))(?=.*(?:🇰🇷|\bK[O]?R\b|Korea|首尔|韩|韓)).*$'

